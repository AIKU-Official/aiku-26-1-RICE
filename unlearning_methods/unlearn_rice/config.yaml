model_family: qwen3_5_2b
model_path: ./finetuned/finetuned_100
method_name: rice

lr: 2e-5

language: en
split: forget01
data_path: locuslab/TOFU

batch_size: 1
gradient_accumulation_steps: 2
num_epochs: 5
beta: 1.
gamma: 1.5
alpha: 0.5
save_dir: ./results/${method_name}
overwrite_dir: false
weight_decay: 0.01
save_model: true
eval_while_train: false
eval_only: false
seed: 42

# RMU parameters
rmu_layers: [18, 19, 20, 21, 22]
rmu_scale: 300.0
rmu_lambda: 1.0

# Forget loss type: "ga" (gradient-ascent CE) or "npo" (reference NPO)
forget_loss_type: ga

# Retain loss type: "ce" (cross-entropy) or "kl" (KL divergence with oracle)
retain_loss_type: ce

eval:
  model_path: ${..model_path}
  model_family: ${..model_family}
  save_dir: ${..save_dir}
  data_path: [locuslab/TOFU, locuslab/TOFU, locuslab/TOFU, locuslab/TOFU]
  split: ${..split}_perturbed
  split_list:
    - retain_perturbed
    - real_authors_perturbed
    - world_facts_perturbed
    - ${split}

  eval_task: [eval_log, eval_real_author_wo_options, eval_real_world_wo_options, eval_log_forget]
  question_key: [question, question, question, question]
  answer_key: [answer, answer, answer, answer]
  base_answer_key: [paraphrased_answer, answer, answer, paraphrased_answer]
  perturbed_answer_key: [perturbed_answer, perturbed_answer, perturbed_answer, perturbed_answer]

  generation:
    max_length: 200
    max_new_tokens: null

  save_generated_text: true
  ds_size: 300
  overwrite: true
  use_pretrained: false
  batch_size: 30
  retain_result: null

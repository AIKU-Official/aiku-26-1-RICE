model_family: qwen3_5_2b
model_path: ./finetuned
method_name: rmu

lr: 2e-5

language: en
split: forget01
data_path: locuslab/TOFU

batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 5
max_steps: null
max_length: 500

activation_layers: [20]
update_layers: [18, 19, 20, 21, 22]
steering_coeff: 300.0
retain_alpha: 1.0

save_dir: ${model_path}/${method_name}_${lr}_${split}_${num_epochs}_${language}
overwrite_dir: false
weight_decay: 0.01
max_grad_norm: 1.0
save_model: true
seed: 42
teacher_device: auto

bf16: true
fp16: false
gradient_checkpointing: true
log_steps: 1

